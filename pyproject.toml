[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "readcast"
version = "0.1.0"
description = "Prepare, narrate, and publish Markdown articles as podcast episodes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["click>=8.1", "PyYAML>=6", "requests>=2.31", "boto3>=1.34", "Pillow>=10"]

[project.scripts]
readcast = "readcast.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["readcast"]

[tool.hatch.build.targets.wheel.force-include]
"readcast/pronunciations.yml" = "readcast/pronunciations.yml"
